  <!-- Optical Disc Ring -->
  <circle cx="64" cy="64" r="31" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 64 33 A 31 31 0 0 1 95 64" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Central D-Pad Cross -->
  <path d="M57 42 H71 V57 H86 V71 H71 V86 H57 V71 H42 V57 H57 Z" fill="url(#dpadGrad)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
